[project]
name = "gh-similarity-detector"
version = "2.0.0"
description = "GitHub 项目代码相似度检测工具 - 用于自我审视和抄袭溯源"
authors = [{name = "ModuleMirror Team", email = "modulemirror@example.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["code-similarity", "clone-detection", "plagiarism", "winnowing", "fingerprint"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
    "rich>=13.3.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "prometheus-client>=0.17",
    "PyJWT>=2.8",
    "datasketch>=1.6.0",
    "mmh3>=4.0.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.95.0", "uvicorn>=0.22.0", "slowapi>=0.1.9"]
visualization = ["pyvis>=0.3.1"]
visualization-enhanced = ["pyvis>=0.3.1", "pyecharts>=2.0.0"]
vector-index = ["faiss-cpu>=1.7.0"]
realtime = ["sse-starlette>=2.0.0"]
structured-logging = ["structlog>=24.0.0"]
tui = ["textual>=0.40.0", "trogon>=0.5.0"]
plugins = ["pluggy>=1.0.0"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
postgres = ["asyncpg>=0.29"]
security = ["keyring>=25.0"]
all-languages = ["tree-sitter-go>=0.23.0", "tree-sitter-rust>=0.23.0", "tree-sitter-c>=0.23.0", "tree-sitter-cpp>=0.23.0", "tree-sitter-kotlin>=0.23.0", "tree-sitter-scala>=0.23.0", "tree-sitter-php>=0.23.0", "tree-sitter-ruby>=0.23.0", "tree-sitter-swift>=0.23.0"]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.5.0"]
profiling = ["scalene>=1.5.0", "memray>=1.7.0"]
all = ["gh-similarity-detector[api,visualization,vector-index,realtime,structured-logging,tui,plugins,otel,postgres,security,all-languages]"]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.78.0",
    "ruff>=0.0.265",
    "mypy>=1.2.0",
    "bandit[toml]>=1.7.0",
]

[project.scripts]
gh-sim = "gh_similarity_detector.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gh_similarity_detector*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["datasketch.*", "pyecharts.*", "faiss.*", "httpx.*", "tenacity.*", "tree_sitter.*", "pyvis.*", "sse_starlette.*", "slowapi.*", "prometheus_client.*", "orjson.*", "mmh3.*", "structlog.*", "textual.*", "trogon.*", "polars.*", "fpdf.*", "datasketch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gh_similarity_detector"]
omit = ["*/tests/*", "*/__pycache__/*", "gh_similarity_detector/api/static/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if _HAS_OTEL:",
    "if not _HAS_OTEL:",
    "if _HAS_PLUGGY:",
    "if not _HAS_PLUGGY:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
